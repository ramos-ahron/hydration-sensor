# Zero-warnings acceptance criterion
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_ASSERT=y

# Enables the logging module
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# IO Input
CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_LONGPRESS=y

# FSM options
CONFIG_FSM_ENUM_STRINGS=y
CONFIG_FSM_MEASURE_MODE_MANUAL=y

# External Sensor
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SPI=y

# Custom Shell
CONFIG_SHELL=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=n

# Hydration specific
CONFIG_MEASURE_INTERVAL_S=60
CONFIG_BENCH_ALLOW_USB=n

# Battery monitor, watchdog, reset cause
CONFIG_ADC=y
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_HWINFO=y

# Records
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x4000

# BLE
CONFIG_CRC=y
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="Hydration"
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_SMP_APP_PAIRING_ACCEPT=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
