CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_ZTEST=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# Same settings partition as the app (firmware/prj.conf). A different size moves the partition
# into the app's NVS area and corrupts it when this test runs on the board.
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x4000
CONFIG_RECORD_SLOTS=8
CONFIG_MAIN_STACK_SIZE=4096
