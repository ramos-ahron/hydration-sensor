name: format

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Require a .clang-format file
        run: test -f .clang-format || { echo "::error::No .clang-format in repo root"; exit 1; }

      - name: Install clang-format
        run: pipx install clang-format==23.1.3

      - name: Check formatting
        run: |
          git ls-files '*.c' '*.cpp' '*.h' '*.hpp' \
            | xargs -r clang-format --dry-run --Werror --style=file --fallback-style=none
