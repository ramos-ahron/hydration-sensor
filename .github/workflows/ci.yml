name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  NCS_VERSION: v3.2.4
  BOARD: nrf21540dk/nrf52840

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build gperf ccache dfu-util device-tree-compiler cmake wget xz-utils
          pip install west

      - name: Cache NCS workspace
        id: cache-ncs
        uses: actions/cache@v4
        with:
          path: |
            ncs
          key: ncs-${{ env.NCS_VERSION }}

      - name: West init
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr "$NCS_VERSION" ncs
          cd ncs
          west update --narrow -o=--depth=1

      - name: Install Python requirements and Zephyr SDK
        working-directory: ncs
        run: |
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt
          pip install -r nrf/scripts/requirements.txt
          pip install -r bootloader/mcuboot/scripts/requirements.txt
          # west sdk picks the SDK version the checked-out Zephyr expects
          west sdk install --toolchains arm-zephyr-eabi

      - name: Build
        working-directory: ncs
        run: |
          west build -p always -b "$BOARD" ../app/firmware -d ../build -- \
            -DCONFIG_DEBUG_THREAD_INFO=y \
            -DCONF_FILE="prj.conf" \
            -DDTC_OVERLAY_FILE="boards/nrf52840dk_nrf52840.overlay"

      - name: Show build output layout
        if: always()
        run: find build -maxdepth 4 \( -name '*.hex' -o -name '*.elf' \) | sort

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/merged.hex
            build/**/zephyr/zephyr.hex
            build/**/zephyr/zephyr.elf
          if-no-files-found: error

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require a .clang-format file
        run: |
          test -f .clang-format || { echo "::error::No .clang-format in repo root; the check would be meaningless"; exit 1; }

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          git ls-files '*.c' '*.cpp' '*.h' '*.hpp' \
            | xargs -r clang-format --dry-run --Werror --style=file --fallback-style=none
